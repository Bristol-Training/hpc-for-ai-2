<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="tl dl">
  <title id="tl">How LoRA changes one weight matrix</title>
  <desc id="dl">The equation W = W0 + B A, drawn as matrices. W0 is the pretrained n by n weight matrix, 4096 by 4096, about 16.8 million values, and it is frozen. Added to it is the product of two thin matrices: B, n rows by r columns, and A, r rows by n columns, with r = 16, much smaller than n. Their product has the same n by n shape as W0, shown as a dashed outline, but only B and A are stored and trained: about 131,000 values, around 128 times fewer. In QLoRA, W0 is also stored in 4 bits.</desc>
  <defs>
    <marker id="note" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#b0306a" stroke-width="1.6"/>
    </marker>
    <pattern id="frozen" width="26" height="26" patternUnits="userSpaceOnUse" x="131" y="153">
      <rect x="2" y="2" width="22" height="22" rx="3" fill="#cfc6d6" stroke="#8a7f93" stroke-width="1"/>
    </pattern>
    <pattern id="trainB" width="26" height="26" patternUnits="userSpaceOnUse" x="387" y="153">
      <rect x="2" y="2" width="22" height="22" rx="3" fill="#b895ce" stroke="#3d0251" stroke-width="1"/>
    </pattern>
    <pattern id="trainA" width="26" height="26" patternUnits="userSpaceOnUse" x="473" y="87">
      <rect x="2" y="2" width="22" height="22" rx="3" fill="#b895ce" stroke="#3d0251" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="860" height="470" fill="#ffffff"/>

  <g stroke="#1d1a22" stroke-width="4" fill="none" stroke-linecap="square">
    <path d="M128 150 H120 V312 H128"/><path d="M290 150 H298 V312 H290"/>
    <path d="M384 150 H376 V312 H384"/><path d="M442 150 H450 V312 H442"/>
    <path d="M470 84 H462 V142 H470"/><path d="M632 84 H640 V142 H632"/>
  </g>

  <!-- W0: n x n, frozen -->
  <rect x="131" y="153" width="156" height="156" fill="url(#frozen)"/>
  <text x="104" y="238" text-anchor="end" font-size="18" fill="#1d1a22">n</text>
  <text x="209" y="336" text-anchor="middle" font-size="18" fill="#1d1a22">n</text>

  <text x="337" y="246" text-anchor="middle" font-size="40" fill="#1d1a22">+</text>

  <!-- B: n x r, trainable -->
  <rect x="387" y="153" width="52" height="156" fill="url(#trainB)"/>
  <text x="413" y="336" text-anchor="middle" font-size="18" fill="#1d1a22">r</text>

  <!-- A: r x n, trainable, above the product -->
  <text x="430" y="124" text-anchor="middle" font-size="30" fill="#1d1a22">×</text>
  <rect x="473" y="87" width="156" height="52" fill="url(#trainA)"/>
  <text x="656" y="120" font-size="18" fill="#1d1a22">r</text>

  <!-- product outline: n x n -->
  <rect x="470" y="150" width="162" height="162" rx="4" fill="none" stroke="#a9a3b2" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="551" y="236" text-anchor="middle" font-size="13" fill="#8a8394">B A is n × n,</text>
  <text x="551" y="254" text-anchor="middle" font-size="13" fill="#8a8394">but never stored</text>
  <text x="656" y="238" font-size="18" fill="#1d1a22">n</text>
  <text x="551" y="336" text-anchor="middle" font-size="18" fill="#1d1a22">n</text>

  <!-- equation -->
  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="56" fill="#1d1a22">
    <text x="40" y="408">W</text>
    <text x="104" y="406" font-style="normal">=</text>
    <text x="180" y="408">W<tspan font-size="32" font-style="normal" dy="12">0</tspan></text>
    <text x="337" y="406" text-anchor="middle" font-style="normal">+</text>
    <text x="413" y="408" text-anchor="middle" fill="#3d0251">B</text>
    <text x="471" y="408" text-anchor="middle" fill="#3d0251">A</text>
  </g>
  <g stroke="#3d0251" stroke-width="3">
    <line x1="392" y1="422" x2="434" y2="422"/><line x1="450" y1="422" x2="492" y2="422"/>
  </g>

  <!-- notes -->
  <g fill="#b0306a" font-size="17" font-style="italic">
    <text x="215" y="462" text-anchor="middle">frozen</text>
    <text x="442" y="462" text-anchor="middle">trainable</text>
    <text x="300" y="44" text-anchor="middle">low rank</text>
    <text x="300" y="66" text-anchor="middle">r = 16, n = 4096</text>
  </g>
  <g stroke="#b0306a" stroke-width="1.6" fill="none" marker-end="url(#note)">
    <path d="M215 444 C211 436 212 432 214 428"/>
    <path d="M420 444 C414 438 412 434 414 430"/>
    <path d="M464 444 C470 438 472 434 470 430"/>
    <path d="M364 50 C410 46 440 60 458 82"/>
    <path d="M300 74 C304 110 340 140 370 156"/>
  </g>

  <!-- numbers -->
  <rect x="690" y="150" width="160" height="80" rx="8" fill="#f4eef8" stroke="#8a7f93" stroke-width="1.5"/>
  <text x="702" y="174" font-size="14" font-weight="700" fill="#4a4250">W<tspan font-size="10" dy="4">0</tspan><tspan dy="-4">: 4096 × 4096</tspan></text>
  <text x="702" y="195" font-size="13" fill="#4a4250">16.8 million values,</text>
  <text x="702" y="214" font-size="13" fill="#4a4250">not changed</text>
  <rect x="690" y="242" width="160" height="80" rx="8" fill="#f4eef8" stroke="#3d0251" stroke-width="1.5"/>
  <text x="702" y="266" font-size="14" font-weight="700" fill="#3d0251">B and A together</text>
  <text x="702" y="287" font-size="13" fill="#3d0251">131,000 values:</text>
  <text x="702" y="306" font-size="13" fill="#3d0251">128 times fewer</text>
  <rect x="690" y="334" width="160" height="62" rx="8" fill="#fff8e1" stroke="#e0a800" stroke-width="1.5"/>
  <text x="702" y="358" font-size="14" font-weight="700" fill="#5c4400">QLoRA</text>
  <text x="702" y="379" font-size="13" fill="#5c4400">also stores W<tspan font-size="10" dy="4">0</tspan><tspan dy="-4"> in 4 bits</tspan></text>
</svg>
